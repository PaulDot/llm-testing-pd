<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Customer Support Sandbox</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #fafafa; }
    #chat-box { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 15px; margin-bottom: 10px; border-radius: 4px; background: #fff; }
    .message { margin: 8px 0; padding: 10px; border-radius: 6px; max-width: 80%; line-height: 1.4; }
    .user { background: #e3f2fd; margin-left: auto; text-align: right; color: #0d47a1; }
    .ai { background: #f5f5f5; color: #212121; }
    #input-container { display: flex; gap: 8px; }
    #chat-input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    #send-btn { padding: 10px 20px; cursor: pointer; background: #1976d2; color: white; border: none; border-radius: 4px; }
    #send-btn:hover { background: #1565c0; }
  </style>
</head>
<body>
  <h2>AI Customer Service Assistant</h2>
  <div id="chat-box"></div>
  <div id="input-container">
    <input type="text" id="chat-input" placeholder="Ask a support question..." />
    <button id="send-btn">Send</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
