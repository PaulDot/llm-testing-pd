name: Playwright UI Automation Pipeline
on:
  pull_request:
    branches: [ main ]
jobs:
  run-ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium Browser and System Dependencies
        run: npx playwright install chromium --with-deps
      
      - name: Run Playwright tests
        run: npm run test:ui

      - name: Upload Test Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
